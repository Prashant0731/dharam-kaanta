<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dharam Kaanta - Weighbridge Entry</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#222}
header{background:#17202a;color:white;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
button{border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.primary{background:#1f7a4d;color:#fff}
.danger{background:#c0392b;color:#fff}
.gray{background:#566573;color:#fff}
.info{padding:10px 15px;background:#fff;border-bottom:1px solid #ddd;font-size:13px}
.table-wrap{overflow:auto;background:white;margin:14px;border:1px solid #ccc;border-radius:8px}
table{border-collapse:collapse;min-width:1000px;width:100%}
th,td{border:1px solid #d5d8dc;padding:8px;text-align:center;vertical-align:middle}
th{background:#273746;color:#fff;position:sticky;top:0;z-index:2;white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;z-index:3;background:#eef2f5}
th:first-child{background:#273746}
input[type=text],input[type=number]{width:100px;padding:7px;border:1px solid #bbb;border-radius:5px}
.photo-box{width:100px;height:70px;display:flex;align-items:center;justify-content:center;margin:auto;background:#f7f7f7;border:1px dashed #aaa;border-radius:5px;overflow:hidden}
.photo-box img{max-width:100%;max-height:100%;object-fit:contain}
.small{font-size:11px;color:#666;margin-top:3px}
.saved{background:#eaf7ef}
.net,.money{font-weight:bold;color:#1f7a4d}
.money{color:#c0392b}
.btn-group{display:flex;gap:4px;justify-content:center}
#toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:12px 16px;border-radius:7px;display:none;z-index:99}
</style>
</head>
<body>
<header>
  <h1>⚖️ Dharam Kaanta - Weighbridge Entry</h1>
  <div>
    <button class="gray" onclick="window.print()">🖨️ Print</button>
  </div>
</header>
<div class="info">
  <b>Auto-calculates:</b> Net = Gross - Tare | Rupees = Net / 5 | Photos compress before save
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th>
<th>Vehicle No.</th>
<th>Tare (kg)</th>
<th>Gross (kg)</th>
<th>Net (kg)</th>
<th>Rupees</th>
<th>Vehicle Photo</th>
<th>Gross Photo</th>
<th>Action</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
<div id="toast"></div>

<script>
const MAX_ROWS = 50;
let data = [];

function initData() {
  data = Array.from({length: MAX_ROWS}, (_, i) => ({
    sno: i + 1,
    vehicle: "",
    tare: "",
    gross: "",
    vehiclePhoto: "",
    grossPhoto: "",
    saved: false
  }));
}

function saveToLocal() {
  localStorage.setItem("dharam_kaanta_data", JSON.stringify(data));
}

function loadFromLocal() {
  const saved = localStorage.getItem("dharam_kaanta_data");
  if (saved) {
    try { data = JSON.parse(saved); } catch(e) { initData(); }
  } else {
    initData();
  }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&": "&", "<": "<", ">": ">", '"': """, "'": "'"
  }[m]));
}

function calcNet(row) {
  const tare = Number(row.tare) || 0;
  const gross = Number(row.gross) || 0;
  if (!tare && !gross) return "";
  return gross - tare;
}

function calcMoney(row) {
  const net = calcNet(row);
  if (net === "") return "";
  return (net / 5).toFixed(2);
}

function photoCell(rowIdx, key, val, label) {
  return `
    <div class="photo-box" id="box-${key}-${rowIdx}">
      ${val ? `<img src="${val}" alt="${label}">` : 
        `<label style="font-size:11px;cursor:pointer">📷 Photo<input type="file" accept="image/*" capture="environment" hidden onchange="photoChanged(${rowIdx}, '${key}', this)"></label>`
      }
    </div>
    <div class="small">${val ? "Photo Added" : "Tap to Capture"}</div>
  `;
}

function compressImage(file, maxWidth = 800, quality = 0.6) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
    };
  });
}

async function photoChanged(rowIdx, key, input) {
  const file = input.files?.[0];
  if (!file) return;
  
  const status = document.getElementById(`status-${rowIdx}`);
  if (status) status.textContent = "Compressing...";
  
  const compressed = await compressImage(file);
  data[rowIdx][key] = compressed;
  saveToLocal();
  render();
}

function updateInputs(rowIdx) {
  const vEl = document.getElementById(`vehicle-${rowIdx}`);
  const tEl = document.getElementById(`tare-${rowIdx}`);
  const gEl = document.getElementById(`gross-${rowIdx}`);
  
  if (vEl) data[rowIdx].vehicle = vEl.value;
  if (tEl) data[rowIdx].tare = tEl.value;
  if (gEl) data[rowIdx].gross = gEl.value;
  
  calcRow(rowIdx);
}

function calcRow(rowIdx) {
  const row = data[rowIdx];
  const net = calcNet(row);
  const money = calcMoney(row);
  
  const netEl = document.getElementById(`net-${rowIdx}`);
  const moneyEl = document.getElementById(`money-${rowIdx}`);
  if (netEl) netEl.textContent = net === "" ? "" : net;
  if (moneyEl) moneyEl.textContent = money === "" ? "" : money;
  
  row.net = net;
  row.money = money;
  saveToLocal();
}

async function saveRow(rowIdx) {
  updateInputs(rowIdx);
  const row = data[rowIdx];
  
  if (!row.vehicle && !row.tare && !row.gross && !row.vehiclePhoto && !row.grossPhoto) {
    toast("Row " + (rowIdx + 1) + " is empty!");
    return;
  }
  
  const btn = document.getElementById(`btn-${rowIdx}`);
  const status = document.getElementById(`status-${rowIdx}`);
  if (btn) btn.disabled = true;
  if (status) status.textContent = "Saving...";
  
  // Here you would send to Google Sheets / API
  // await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify(row) });
  
  // For now just mark as saved locally
  const currentVehicle = row.vehicle;
  data[rowIdx] = {
    sno: rowIdx + 1,
    vehicle: currentVehicle,
    tare: "",
    gross: "",
    vehiclePhoto: "",
    grossPhoto: "",
    saved: true
  };
  
  saveToLocal();
  render();
  toast("Row " + (rowIdx + 1) + " saved!");
}

function clearRow(rowIdx, clearVehicle = false) {
  const veh = clearVehicle ? "" : data[rowIdx].vehicle;
  data[rowIdx] = {
    sno: rowIdx + 1,
    vehicle: veh,
    tare: "",
    gross: "",
    vehiclePhoto: "",
    grossPhoto: "",
    saved: false
  };
  saveToLocal();
  render();
  toast("Row " + (rowIdx + 1) + " cleared!");
}

function toast(msg) {
  const t = document.getElementById("toast");
  if (t) {
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2500);
  }
}

function render() {
  const body = document.getElementById("rows");
  body.innerHTML = "";
  
  for (let i = 0; i < MAX_ROWS; i++) {
    const r = data[i];
    const net = calcNet(r);
    const money = calcMoney(r);
    
    const tr = document.createElement("tr");
    if (r.saved) tr.className = "saved";
    
    tr.innerHTML = `
      <td><b>${i + 1}</b></td>
      <td><input id="vehicle-${i}" type="text" value="${esc(r.vehicle)}" placeholder="RJ14AB1234" oninput="updateInputs(${i})"></td>
      <td><input id="tare-${i}" type="number" value="${esc(r.tare)}" placeholder="kg" oninput="calcRow(${i})"></td>
      <td><input id="gross-${i}" type="number" value="${esc(r.gross)}" placeholder="kg" oninput="calcRow(${i})"></td>
      <td class="net" id="net-${i}">${net === "" ? "" : net}</td>
      <td class="money" id="money-${i}">${money === "" ? "" : money}</td>
      <td>${photoCell(i, "vehiclePhoto", r.vehiclePhoto, "Vehicle")}</td>
      <td>${photoCell(i, "grossPhoto", r.grossPhoto, "Gross")}</td>
      <td>
        <div class="btn-group">
          <button class="primary" id="btn-${i}" onclick="saveRow(${i})">☁️ Save</button>
          <button class="danger" onclick="clearRow(${i}, true)">🔄 Clear</button>
        </div>
        <div class="status" id="status-${i}">${r.saved ? "✓ Saved" : ""}</div>
      </td>
    `;
    body.appendChild(tr);
  }
}

loadFromLocal();
render();
</script>
</body>
</html>
